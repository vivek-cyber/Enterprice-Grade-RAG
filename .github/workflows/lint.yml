name: Docstring & README coverage

# Backstop for .pre-commit-config.yaml: catches anything pushed without the
# local git hook installed (a fresh clone, a --no-verify commit, a different
# machine). Same config, same checks, so local and CI never disagree.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pre-commit run --all-files
